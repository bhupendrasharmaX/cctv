name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the core dependencies. The detector and recognizer import torch,
      # ultralytics and easyocr lazily, so the API, analytics and plate logic
      # are all testable without pulling a multi-gigabyte ML stack into CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

      - name: Check the app imports without the AI stack installed
        run: |
          python - <<'PY'
          import importlib, sys
          for blocked in ("torch", "ultralytics", "easyocr"):
              assert blocked not in sys.modules, f"{blocked} imported at module scope"
          importlib.import_module("backend.app.main")
          for blocked in ("torch", "ultralytics", "easyocr"):
              assert blocked not in sys.modules, (
                  f"importing the app pulled in {blocked}; keep AI imports lazy"
              )
          print("app imports cleanly without the AI stack")
          PY
